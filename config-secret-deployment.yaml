apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-secret-app
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-secret-app
  template:
    metadata:
      labels:
        app: config-secret-app
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: nginx-config
            - secretRef:
                name: nginx-secret
